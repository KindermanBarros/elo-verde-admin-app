name: Android release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate semantic version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
          if [[ -n "${latest_tag}" ]]; then
            base="${latest_tag#v}"
            commits="$(git log --format=%s "${latest_tag}..HEAD")"
          else
            base="0.0.0"
            commits="$(git log --format=%s)"
          fi

          IFS=. read -r major minor patch <<< "${base}"
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}

          if grep -Eiq '^release([[:space:]]*\([^)]*\))?[[:space:]]*:' <<< "${commits}"; then
            ((major+=1)); minor=0; patch=0
          elif grep -Eiq '^feat([[:space:]]*\([^)]*\))?[[:space:]]*:' <<< "${commits}"; then
            ((minor+=1)); patch=0
          elif grep -Eiq '^bugfix([[:space:]]*\([^)]*\))?[[:space:]]*:' <<< "${commits}"; then
            ((patch+=1))
          else
            echo "No release-worthy commit since ${latest_tag:-the beginning}; skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${major}.${minor}.${patch}"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          echo "Version: ${version} (${version_code})"
          {
            echo "should_release=true"
            echo "version=${version}"
            echo "version_code=${version_code}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        if: steps.version.outputs.should_release == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle wrapper
        if: steps.version.outputs.should_release == 'true'
        run: gradle wrapper --gradle-version 8.10.2

      - name: Provide Firebase configuration
        if: steps.version.outputs.should_release == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [[ -z "${GOOGLE_SERVICES_JSON}" ]]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON repository secret."
            exit 1
          fi
          printf '%s' "${GOOGLE_SERVICES_JSON}" > app/google-services.json

      - name: Build Android packages
        if: steps.version.outputs.should_release == 'true'
        run: |
          ./gradlew assembleRelease bundleRelease \
            -PreleaseVersion="${{ steps.version.outputs.version }}" \
            -PreleaseCode="${{ steps.version.outputs.version_code }}"
          mkdir -p release
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -exec cp {} release/ \;
          test -n "$(find release -type f -print -quit)"

      - name: Publish GitHub Release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Elo Verde Admin v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release/*
