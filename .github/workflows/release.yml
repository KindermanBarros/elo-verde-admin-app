name: Android release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate semantic version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
          if [[ -n "${latest_tag}" ]]; then
            base="${latest_tag#v}"
            commits="$(git log --format=%s "${latest_tag}..HEAD")"
          else
            base="0.0.0"
            commits="$(git log --format=%s)"
          fi

          IFS=. read -r major minor patch <<< "${base}"
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}

          if grep -Eiq '^release([[:space:]]*\([^)]*\))?[[:space:]]*:' <<< "${commits}"; then
            ((major+=1)); minor=0; patch=0
          elif grep -Eiq '^feat([[:space:]]*\([^)]*\))?[[:space:]]*:' <<< "${commits}"; then
            ((minor+=1)); patch=0
          elif grep -Eiq '^bugfix([[:space:]]*\([^)]*\))?[[:space:]]*:' <<< "${commits}"; then
            ((patch+=1))
          else
            echo "No release-worthy commit since ${latest_tag:-the beginning}; skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${major}.${minor}.${patch}"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          {
            echo "should_release=true"
            echo "version=${version}"
            echo "version_code=${version_code}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        if: steps.version.outputs.should_release == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.version.outputs.should_release == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'

      - name: Generate Gradle wrapper
        if: steps.version.outputs.should_release == 'true'
        run: gradle wrapper --gradle-version 9.4.1

      - name: Restore protected build files
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          INTERNAL_KEYSTORE_BASE64: ${{ secrets.INTERNAL_KEYSTORE_BASE64 }}
          INTERNAL_KEYSTORE_PASSWORD: ${{ secrets.INTERNAL_KEYSTORE_PASSWORD }}
          INTERNAL_KEY_ALIAS: ${{ secrets.INTERNAL_KEY_ALIAS }}
          INTERNAL_KEY_PASSWORD: ${{ secrets.INTERNAL_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for secret_name in             GOOGLE_SERVICES_JSON             INTERNAL_KEYSTORE_BASE64             INTERNAL_KEYSTORE_PASSWORD             INTERNAL_KEY_ALIAS             INTERNAL_KEY_PASSWORD
          do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing ${secret_name} repository secret."
              exit 1
            fi
          done

          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          printf '%s' "$INTERNAL_KEYSTORE_BASE64"             | base64 --decode > "$RUNNER_TEMP/elo-verde-internal.jks"
          chmod 600 "$RUNNER_TEMP/elo-verde-internal.jks"

      - name: Build signed internal release APK
        if: steps.version.outputs.should_release == 'true'
        env:
          ORG_GRADLE_PROJECT_internalKeystorePath: ${{ runner.temp }}/elo-verde-internal.jks
          ORG_GRADLE_PROJECT_internalKeystorePassword: ${{ secrets.INTERNAL_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_internalKeyAlias: ${{ secrets.INTERNAL_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_internalKeyPassword: ${{ secrets.INTERNAL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew clean assembleRelease             -PreleaseVersion="${{ steps.version.outputs.version }}"             -PreleaseCode="${{ steps.version.outputs.version_code }}"

          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk             "release/elo-verde-admin-v${{ steps.version.outputs.version }}.apk"

          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::Android apksigner was not found."
            exit 1
          fi
          "$apksigner_path" verify --verbose --print-certs             "release/elo-verde-admin-v${{ steps.version.outputs.version }}.apk"

      - name: Publish GitHub Release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Elo Verde Admin v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release/*.apk

      - name: Remove protected build files
        if: always()
        run: |
          rm -f app/google-services.json
          rm -f "$RUNNER_TEMP/elo-verde-internal.jks"
